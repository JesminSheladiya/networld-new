# existing datasource, jpa, server.port keep as-is
spring.datasource.url=jdbc:postgresql://localhost:5432/contacts_db
spring.datasource.username=postgres
spring.datasource.password=mac2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# JWT
jwt.secret=ReplaceWithAtLeast32CharsSecretKey_ChangeMe_1234567890
jwt.expiration=86400000

# Resend OTP (never commit the key — it comes from the environment)
# local run: export RESEND_API_KEY=re_xxx
# test mode without a domain: RESEND_FROM=onboarding@resend.dev
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# OTP test hook — local regression tests only. Never enable in production.
# export OTP_TEST_MODE=true  (scripts/test-reciprocals.py reads the OTP through it)
app.otp.test-mode=${OTP_TEST_MODE:false}


spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

