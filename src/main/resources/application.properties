# existing datasource, jpa, server.port keep as-is
spring.datasource.url=jdbc:postgresql://localhost:5432/contacts_db
spring.datasource.username=postgres
spring.datasource.password=mac2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# Auth cookie security. Keep false only for local HTTP development; set
# AUTH_COOKIE_SECURE=true behind HTTPS in staging/production.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ── Scale settings (10M-user ready) ───────────────────────────────────
# HikariCP: defaults (10 conns) starve under concurrent load. 20 handles
# bursts on a single instance; add PgBouncer/replicas before raising further.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
# JDBC batching for bulk writes (e.g. suggestion regeneration inserts).
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT
jwt.secret=ReplaceWithAtLeast32CharsSecretKey_ChangeMe_1234567890
jwt.expiration=86400000

# OTP mail sender — SMTP first (delivers to ANY address), Resend fallback.
# Gmail SMTP (free ~500/day). Needs a Gmail App Password:
# Google Account -> Security -> 2-Step Verification ON -> App passwords -> create.
# >>> DO NOT put real keys here — this file is tracked by git. <<<
# Put per-PC secrets in application-local.properties (gitignored, never synced)
# and run with: SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
# (Or export env vars: GMAIL_SMTP_USER / GMAIL_SMTP_PASS / RESEND_API_KEY.)
mail.smtp.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${GMAIL_SMTP_PORT:587}
mail.smtp.username=${GMAIL_SMTP_USER:}
mail.smtp.password=${GMAIL_SMTP_PASS:}
mail.smtp.from=${GMAIL_SMTP_FROM:}

# Resend OTP fallback (test domain delivers to the account owner's email only;
# verify a custom domain in Resend for production use).
# local run: export RESEND_API_KEY=re_xxx
# test mode without a domain: RESEND_FROM=networld@resend.dev
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:NetWorld@resend.dev}

# OTP test hook — local regression tests only. Never enable in production.
# export OTP_TEST_MODE=true  (scripts/test-reciprocals.py reads the OTP through it)
app.otp.test-mode=${OTP_TEST_MODE:false}

# ── Rate limiting (Strict) ──────────────────────────────────────────
# In-memory fixed-window, per IP. Auth/OTP buckets stop brute-force +
# mail bombing; global bucket stops generic API abuse. 429 + Retry-After
# is returned when a bucket is full.
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}
app.ratelimit.auth-requests=${APP_RATELIMIT_AUTH_REQUESTS:5}
app.ratelimit.auth-window-minutes=${APP_RATELIMIT_AUTH_WINDOW_MINUTES:1}
app.ratelimit.otp-requests=${APP_RATELIMIT_OTP_REQUESTS:3}
app.ratelimit.otp-window-minutes=${APP_RATELIMIT_OTP_WINDOW_MINUTES:1}
app.ratelimit.global-requests=${APP_RATELIMIT_GLOBAL_REQUESTS:100}
app.ratelimit.global-window-minutes=${APP_RATELIMIT_GLOBAL_WINDOW_MINUTES:1}
app.ratelimit.read-requests=${APP_RATELIMIT_READ_REQUESTS:600}
app.ratelimit.read-window-minutes=${APP_RATELIMIT_READ_WINDOW_MINUTES:1}
# true = shared Redis counter (multi-instance). false = in-memory.
# When Redis is unavailable, the service automatically falls back to memory without failing requests.
app.ratelimit.distributed=${APP_RATELIMIT_DISTRIBUTED:false}

# ── Login brute-force protection (tiered lockout, per account) ────
# 5 fails -> 1-min lock -> +3 tries (remaining-count messages) -> 3h lock.
# After the 3h lock expires: fresh +3 tries -> 24h lock, then 24h cycles.
# Success resets everything. Unknown identifiers are NOT counted (no row);
# the per-IP rate limit below still throttles those.
app.security.login-max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login-first-lock-minutes=${APP_SECURITY_LOGIN_FIRST_LOCK_MINUTES:1}
app.security.login-extra-attempts=${APP_SECURITY_LOGIN_EXTRA_ATTEMPTS:3}
app.security.login-extended-lock-hours=${APP_SECURITY_LOGIN_EXTENDED_LOCK_HOURS:3}
app.security.login-repeat-lock-hours=${APP_SECURITY_LOGIN_REPEAT_LOCK_HOURS:24}

# Separate OTP send quota per normalized email and purpose.
# Register = 3, forgot-password = 3, delete-account = 3 per 24h.
app.security.otp-daily-limit=${APP_SECURITY_OTP_DAILY_LIMIT:3}
app.security.otp-quota-hours=${APP_SECURITY_OTP_QUOTA_HOURS:24}

# ── Redis (rate-limit shared counter) ───────────────────────────────
# Only StringRedisTemplate is used here (Lua counter); Redis repositories stay disabled so JPA repositories are not scanned as Redis repositories.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}


spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# ── Data-load logging for mobile / terminal debugging ──────────────────
# Each HTTP request prints one line to the backend terminal:
#   [DATA-LOAD] GET /api/contacts/paginated 200  queries=2 entityLoads=6 collectionLoads=0 41ms | totals queries=19 ...
# Set APP_DATA_LOAD_LOGGING=false to switch off (recommended before production).
app.dataload.logging.enabled=${APP_DATA_LOAD_LOGGING:true}

# Hibernate query statistics (required by DataLoadLogFilter). Small per-query
# overhead; follows APP_DATA_LOAD_LOGGING so it is off when logging is off.
spring.jpa.properties.hibernate.generate_statistics=${APP_DATA_LOAD_LOGGING:true}
