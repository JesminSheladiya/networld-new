# =====================================================================
# NetWorld Backend — application.properties (COMMITTED / PUBLISHED)
# =====================================================================
# This file is tracked by git and published to GitHub. It MUST NOT contain
# real passwords, API keys, or signing secrets.
#
# All secrets are read from environment variables (or from the gitignored
# src/main/resources/application-local.properties when running with
# SPRING_PROFILES_ACTIVE=local). Missing required secrets fail fast at startup.
#
# Local dev example (never commit):
#   export DB_PASSWORD=...
#   export JWT_SECRET="$(openssl rand -base64 32)"
#   SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
# =====================================================================

# ── Datasource (credentials via env — defaults below are for LOCAL DEV ONLY;
#    production MUST override via DB_USERNAME / DB_PASSWORD env vars) ──────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contacts_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mac2}
spring.datasource.driver-class-name=org.postgresql.Driver
# Fail fast in production if a password was not provided.
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.leak-detection-threshold=60000

# ── JPA / Hibernate ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

# SQL logging is OFF by default — it can leak parameter values and data
# into application logs. Enable only for local debugging:
#   export APP_SQL_LOGGING=true
spring.jpa.show-sql=${APP_SQL_LOGGING:false}
spring.jpa.properties.hibernate.format_sql=${APP_SQL_LOGGING:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:warn}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:warn}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.generate_statistics=${APP_DATA_LOAD_LOGGING:false}
# JDBC batching for bulk writes.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Server ────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
# Auth cookie secure flag. True (HTTPS-only) by default. Set
# AUTH_COOKIE_SECURE=false only for local HTTP development.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Response compression (helps slow/mobile networks)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# ── JWT (signing secret via env — default below is LOCAL DEV ONLY and
#    MUST be overridden via JWT_SECRET env var in production) ─────────────
jwt.secret=${JWT_SECRET:dev-insecure-do-not-use-in-production-override-via-JWT_SECRET-env-1234567890abcdef}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ── OTP mail sender — SMTP first (delivers to ANY address), Resend fallback.
# All credentials are env-only; no defaults. See application-local.properties
# for the gitignored local copy used with SPRING_PROFILES_ACTIVE=local.
mail.smtp.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${GMAIL_SMTP_PORT:587}
mail.smtp.username=${GMAIL_SMTP_USER:}
mail.smtp.password=${GMAIL_SMTP_PASS:}
mail.smtp.from=${GMAIL_SMTP_FROM:}

# Resend OTP fallback (test domain delivers to the account owner's email only;
# verify a custom domain in Resend for production use).
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:NetWorld@resend.dev}

# ── OTP test hook — local regression tests only. Never enable in production. ──
app.otp.test-mode=${OTP_TEST_MODE:false}

# ── Rate limiting (Strict) ────────────────────────────────────────────
# In-memory fixed-window, per IP. Auth/OTP buckets stop brute-force +
# mail bombing; global bucket stops generic API abuse. 429 + Retry-After
# is returned when a bucket is full.
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}
app.ratelimit.auth-requests=${APP_RATELIMIT_AUTH_REQUESTS:5}
app.ratelimit.auth-window-minutes=${APP_RATELIMIT_AUTH_WINDOW_MINUTES:1}
app.ratelimit.otp-requests=${APP_RATELIMIT_OTP_REQUESTS:3}
app.ratelimit.otp-window-minutes=${APP_RATELIMIT_OTP_WINDOW_MINUTES:1}
app.ratelimit.global-requests=${APP_RATELIMIT_GLOBAL_REQUESTS:100}
app.ratelimit.global-window-minutes=${APP_RATELIMIT_GLOBAL_WINDOW_MINUTES:1}
app.ratelimit.read-requests=${APP_RATELIMIT_READ_REQUESTS:600}
app.ratelimit.read-window-minutes=${APP_RATELIMIT_READ_WINDOW_MINUTES:1}
# true = shared Redis counter (multi-instance). false = in-memory.
# When Redis is unavailable, the service automatically falls back to memory without failing requests.
app.ratelimit.distributed=${APP_RATELIMIT_DISTRIBUTED:false}

# ── Login brute-force protection (tiered lockout, per account) ────────
app.security.login-max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login-first-lock-minutes=${APP_SECURITY_LOGIN_FIRST_LOCK_MINUTES:1}
app.security.login-extra-attempts=${APP_SECURITY_LOGIN_EXTRA_ATTEMPTS:3}
app.security.login-extended-lock-hours=${APP_SECURITY_LOGIN_EXTENDED_LOCK_HOURS:3}
app.security.login-repeat-lock-hours=${APP_SECURITY_LOGIN_REPEAT_LOCK_HOURS:24}

# Separate OTP send quota per normalized email and purpose.
# Register = 3, forgot-password = 3, delete-account = 3 per 24h.
app.security.otp-daily-limit=${APP_SECURITY_OTP_DAILY_LIMIT:3}
app.security.otp-quota-hours=${APP_SECURITY_OTP_QUOTA_HOURS:24}

# ── Redis (rate-limit shared counter) ─────────────────────────────────
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# ── Data-load logging (mobile / terminal debugging) ───────────────────
# Each HTTP request prints one line to the backend terminal. OFF by default
# in production — set APP_DATA_LOAD_LOGGING=true only while debugging locally.
app.dataload.logging.enabled=${APP_DATA_LOAD_LOGGING:false}
